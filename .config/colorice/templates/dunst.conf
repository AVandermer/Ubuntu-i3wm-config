[global]
monitor = 0
follow = mouse
width = 300
origin = top-right
offset = 20x20
padding = 12
horizontal_padding = 12
text_icon_padding = 12
icon_position = left
max_icon_size = 32
font = UbuntuMono Nerd Font 10
corner_radius = 12
frame_width = 0
sort = yes
idle_threshold = 120
line_height = 0
markup = full
format = "<b>%s</b>\n%b"
alignment = left
word_wrap = yes

[urgency_low]
timeout = 5
background = "{background}E6"
foreground = "{color8}"

[urgency_normal]
timeout = 10
background = "{background}E6"
foreground = "{foreground}"

[urgency_critical]
timeout = 0
background = "{color1}E6"
foreground = "{color7}"
