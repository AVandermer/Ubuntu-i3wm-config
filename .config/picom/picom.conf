# Скругления
corner-radius = 15;
rounded-corners-exclude = [ "class_g = 'Polybar'", "class_g = 'rofi'" ];

# Тени
shadow = true;
shadow-radius = 15;
offset-x = -15;
offset-y = -15;
shadow-opacity = 0.4;
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
    "class_g = 'dunst'",
    "class_g = 'Steam'",
    "class_g = 'steam'",
    "name = 'Notification'"
];

# Прозрачность
inactive-opacity-override = false;
opacity-rule = [
"100:class_g = 'Steam'",
"100:class_g = 'steam'", 
"90:class_g = 'kitty' && focused", 
"80:class_g = 'kitty' && !focused", 
"80:class_g = 'Rofi'", 
"85:class_g = 'Polybar'"]

# Прозрачность для неактивных и активных окон
inactive-opacity = 0.9;
active-opacity = 1.0;

# Легкое затемнение неактивных окон (эффект тени)
inactive-dim = 0.1;

# Убираем рамки окон i3 (чтобы было красивее со скруглениями)
frame-opacity = 1.0;

# Блюр (используем плоские переменные вместо блока)
backend = "glx";
blur: {
    method = "dual_kawase";
    strength = 7;
    background = true;
};

blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "class_g = 'Steam'",
    "class_g = 'steam'"
];

# Анимации
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Системные настройки
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
vsync = true;
glx-no-stencil = true;
use-damage = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; blur-background = false; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; blur-background = false; };
  dropdown_menu = { shadow = false; blur-background = false; };
  menu = { shadow = false; blur-background = false; };
  utility = { shadow = false; blur-background = false; };
};
