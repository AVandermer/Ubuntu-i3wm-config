# colorice theme — generated from /home/avandermer/Pictures/wallpapers/tennis.png
# Usage: add `include ~/.config/i3/colorice-colors.conf` to ~/.config/i3/config
# Requires i3 >= 4.20

set $background  #070c11
set $foreground  #e1e3de
set $cursor      #00b8a2

set $color0      #070c11
set $color1      #4e818a
set $color2      #3780ae
set $color3      #008784
set $color4      #00b8a2
set $color5      #00b0d8
set $color6      #c3a4cb
set $color7      #e1e3de
set $color8      #727a81
set $color9      #66a0aa
set $color10     #4d9fd4
set $color11     #18a8a4
set $color12     #23dbc2
set $color13     #25d2ff
set $color14     #e6c3ef
set $color15     #e4e5e1

# Window colors            border       background   text         indicator    child_border
client.focused             $color4      $color4      $background  $color6      $color4
client.focused_inactive    $color8      $color8      $foreground  $color8      $color8
client.unfocused           $background  $background  $color8      $background  $background
client.urgent              $color1      $color1      $foreground  $color1      $color1
