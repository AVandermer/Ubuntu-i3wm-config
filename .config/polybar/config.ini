[colors]
; Тянем цвета из pywal, после двоеточия указан цвет по умолчанию (на случай ошибки)
background = ${xrdb:color0:#0e1827}
foreground = ${xrdb:color7:#f0f0f0}
; В качестве акцента обычно хорошо смотрятся 4, 2 или 5 цвета из палитры pywal
primary = ${xrdb:color4:#A88A69} 
alert = ${xrdb:color1:#A54242}
disabled = ${xrdb:color8:#6c809e}

; =======================================
; 1. ЛЕВАЯ ПАНЕЛЬ (РАБОЧИЕ СТОЛЫ)
; =======================================
[bar/workspace]
width = 20%
height = 30pt
offset-x = 1.1%
offset-y = 10px
radius = 12
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
font-0 = JetBrainsMono Nerd Font:size=11;2

modules-left = xworkspaces

wm-restack = i3
override-redirect = true
cursor-click = pointer

; =======================================
; 2. ЦЕНТРАЛЬНАЯ ПАНЕЛЬ (ОКНА / МУЗЫКА)
; =======================================
[bar/music]
width = 25%
height = 30pt
offset-x = 37.5%
offset-y = 10px
radius = 12
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
font-0 = JetBrainsMono Nerd Font:size=14;4

modules-center = prev toggle next song

wm-restack = i3
override-redirect = true
cursor-click = pointer



; =======================================
; 3. ПРАВАЯ ПАНЕЛЬ (СТАТУС И СИСТЕМА)
; =======================================
[bar/status]
width = 33%
height = 30pt
offset-x = 66%
offset-y = 10px
radius = 12
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=11;2

; Здесь твои рабочие модули с твоими настройками железа
modules-center = pulseaudio backlight battery date xkeyboard tray power-menu 

wm-restack = i3
override-redirect = true
cursor-click = pointer

; =======================================
; ТВОИ РОДНЫЕ И РАБОЧИЕ МОДУЛИ
; =======================================

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-foreground = ${colors.primary}
label-active-padding = 1
label-occupied = 
label-occupied-padding = 1
label-urgent = 
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume>
ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-foreground = ${colors.primary}
label-volume = "%percentage%% "
label-muted = "󰖁 Muted "
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 5
battery = BAT0
adapter = ADP0
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
format-full = <ramp-capacity>  100%
animation-charging-foreground = ${colors.primary}
ramp-capacity-foreground = ${colors.primary}
label-charging = "%percentage%% "
label-discharging = "%percentage%% "

ramp-capacity-0 = "󰂎"
ramp-capacity-1 = "󰁼"
ramp-capacity-2 = "󰁿"
ramp-capacity-3 = "󰂁"
ramp-capacity-4 = "󰁹"

animation-charging-0 = "󰢟"
animation-charging-1 = "󰂇"
animation-charging-2 = "󰂉"
animation-charging-3 = "󰂊"
animation-charging-4 = "󰂅"
animation-charging-framerate = 750

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
use-actual-brightness = true
format = <ramp> <label>
ramp-foreground = ${colors.primary}
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃝 
ramp-2 = 󰃟 
ramp-3 = 󰃠 

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = "%percentage:2%% "

[module/wlan]
type = internal/network
interface-type = wireless
interval = 1
format-connected = <ramp-signal> <label-connected>
ramp-signal-foreground = ${colors.primary}
label-connected = " %essid% "
ramp-signal-0 = "󰤯"
ramp-signal-1 = "󰤟"
ramp-signal-2 = "󰤢"
ramp-signal-3 = "󰤥"
ramp-signal-4 = "󰤨"

[module/date]
type = internal/date
interval = 1
date = %a %b %d %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/prev]
type = custom/script
exec = echo "󰒮"
format = <label>
format-foreground = ${colors.primary}
click-left = playerctl previous &

[module/toggle]
type = custom/script
exec = [ "$(playerctl status 2>/dev/null)" = "Playing" ] && echo "󰏤" || echo "󰐊"
interval = 2
format = <label>
format-foreground = ${colors.foreground}
padding = 1
click-left = playerctl play-pause &

[module/next]
type = custom/script
exec = echo "󰒭"
format = <label>
format-foreground = ${colors.primary}
click-left = playerctl next &

[module/spotify-prev]
type = custom/text
content = "󰒮"
content-font = 3
content-foreground = ${colors.foreground}
click-left = playerctl previous -p spotify

[module/spotify-play-pause]
type = custom/script
exec = playerctl status -p spotify 2>/dev/null | grep -q 'Playing' && echo "󰏤" || echo "󰐊"
interval = 0.5
format-font = 3
format-foreground = ${colors.foreground}
click-left = playerctl play-pause -p spotify

[module/spotify-next]
type = custom/text
content = "󰒭"
content-font = 3
content-foreground = ${colors.foreground}
click-left = playerctl next -p spotify

[module/song]
type = custom/script
; Выводим "Артист - Трек", если плеер запущен, иначе пишем "Тишина..."
exec = playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null || echo "Тишина..."
format = <label>
; Иконка Spotify из Nerd Fonts
format-prefix = "   " 
format-prefix-foreground = ${colors.primary}
interval = 1

[module/power-menu]
type = custom/script
exec = echo " 󰐥 "
format-foreground = ${colors.alert}
click-left = ~/.config/polybar/scripts/power-menu.sh &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = "󰌌 %layout%"
label-layout-foreground = ${colors.primary}
format-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 18
format-background = ${colors.background}
format-padding = 1

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth-status.sh &
format-foreground = ${colors.primary}
interval = 0.5
tail = true
click-left = ~/.config/polybar/scripts/bluetooth-status.sh -t &

[settings]
screenchange-reload = false
pseudo-transparency = true
